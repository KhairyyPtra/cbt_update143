<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
html,body{margin:0;padding:0;background:#ffffff;color:#251a12;font-family:"Roboto",system-ui,sans-serif}
#status{padding:24px 18px;color:#6f6155;font-size:15px;line-height:1.5}
#status.gagal{color:#b42318}
.mce-tinymce{border:0 !important;box-shadow:none !important}
.mce-toolbar-grp{position:sticky;top:0;z-index:5}
.mce-btn button{padding:6px 7px !important}
.wrs_modal_overlay{position:fixed !important;inset:0 !important}
.wrs_modal_dialogContainer,.wrs_modal_dialogContainer.wrs_modal_desktop,.wrs_modal_dialogContainer.wrs_modal_android,.wrs_modal_dialogContainer.wrs_modal_mobile{position:fixed !important;top:0 !important;left:0 !important;right:0 !important;bottom:0 !important;width:100% !important;height:100% !important;max-width:100vw !important;margin:0 !important;transform:none !important;border:0 !important;display:flex !important;flex-direction:column !important}
.wrs_modal_title_bar{flex:0 0 auto}
.wrs_modal_iframeContainer{flex:1 1 auto !important;width:100% !important;height:auto !important;min-height:0 !important}
.wrs_modal_iframeContainer{overflow:hidden !important;position:relative}
.wrs_modal_iframe,.wrs_modal_iframe.wrs_modal_android,.wrs_modal_iframe.wrs_modal_mobile{width:calc(100% / var(--skala-wiris, 1)) !important;height:calc(100% / var(--skala-wiris, 1)) !important;margin:0 !important;border:0 !important;transform:scale(var(--skala-wiris, 1));transform-origin:0 0}
</style>
</head>
<body>
<div id="status">Memuat editor…</div>
<textarea id="isi" style="visibility:hidden;height:1px"></textarea>
<script>
/*
 * Editor soal aplikasi guru = TinyMCE + plugin WIRIS milik server CBT (sama dengan editor web), dimuat dengan
 * alamat dasar server sehingga plugin dan integrasi WIRIS (createimage, showimage) berjalan seperti di web.
 * Bila editor server tidak bisa dimuat, aplikasi beralih ke editor sederhana (editor-sederhana.html).
 */
(function () {
  var editor = null;
  var isiAwal = '';
  var kontenAwal = null;
  var petunjuk = '';

  function alamat(jalur) {
    return new URL(jalur, document.baseURI).href;
  }

  function gagal(pesan) {
    var status = document.getElementById('status');
    status.className = 'gagal';
    status.textContent = pesan;
    if (window.Azedit && window.Azedit.gagalMuat) window.Azedit.gagalMuat();
  }

  function muatSkrip(src, selesai) {
    var skrip = document.createElement('script');
    skrip.src = src;
    skrip.onload = selesai;
    skrip.onerror = function () { gagal('Editor tidak bisa dimuat dari server.'); };
    document.head.appendChild(skrip);
  }

  function versiHarian() {
    return '?v=' + Math.floor(Date.now() / 86400000);
  }

  function tinggiEditor() {
    return Math.max(260, window.innerHeight - 110);
  }

  /* Server yang sudah diperbarui punya editor rumus lokal (assets/js/rumus-lokal.js): plugin & tombol WIRIS diganti
     tombol rumus dan H2O; rumus WIRIS lama diketik ulang lewat klik dua kali. Server lama tetap memakai WIRIS. */
  function cekRumusLokal(selesai) {
    if (!window.fetch) {
      selesai(false);
      return;
    }
    fetch(alamat('assets/js/rumus-lokal.js'), { method: 'HEAD', cache: 'no-store' })
      .then(function (balasan) { selesai(balasan.ok); })
      .catch(function () { selesai(false); });
  }

  function mulai() {
    if (!window.tinymce) {
      gagal('Editor tidak bisa dimuat dari server.');
      return;
    }
    cekRumusLokal(pasangEditor);
  }

  function pasangEditor(rumusLokal) {
    var pluginLuar = {
      azaksara: alamat('__azapp/aksara-ketik.js') + versiHarian(),
      azarab: alamat('__azapp/arab-ketik.js') + versiHarian()
    };
    var tombolRumus = 'tiny_mce_wiris_formulaEditor tiny_mce_wiris_formulaEditorChemistry';
    var pluginEditor = 'lists advlist table directionality charmap tiny_mce_wiris';
    if (rumusLokal) {
      pluginEditor = 'lists advlist table directionality charmap';
      pluginLuar.azrumus = alamat('assets/js/rumus-lokal.js') + versiHarian();
      tombolRumus = 'azrumus azkimia';
    }
    tinymce.init({
      selector: '#isi',
      theme: 'modern',
      skin: 'lightgray',
      menubar: false,
      statusbar: false,
      branding: false,
      height: tinggiEditor(),
      content_css: alamat('assets/css/aksara.css'),
      external_plugins: pluginLuar,
      content_style: ".mce-content-body {font-family: 'times new roman', times, serif; font-size: 13pt; padding: 4px 6px;} .mce-content-body img {max-width: 100%; height: auto;}",
      plugins: pluginEditor,
      toolbar: 'undo redo | bold italic underline superscript subscript removeformat | ' + tombolRumus + ' | azgambar table | bullist numlist | alignleft aligncenter alignright | azarab azaksara | ltr rtl',
      extended_valid_elements: 'img[class|src|border=0|alt|title|hspace|vspace|width|height|align|name|id|style|role|data-mathml|data-latex|data-custom-editor|data-aksara-skrip|data-aksara-latin|data-aksara-ukuran],p[class|name|id|style]',
      table_default_attributes: { border: 1, cellpadding: 4 },
      table_default_styles: { borderCollapse: 'collapse', width: '100%' },
      paste_data_images: false,
      relative_urls: false,
      remove_script_host: true,
      document_base_url: '/',
      forced_root_block: '',
      force_br_newlines: true,
      force_p_newlines: false,
      setup: function (ed) {
        ed.addButton('azgambar', {
          icon: 'image',
          tooltip: 'Sisipkan gambar',
          onclick: function () {
            if (window.Azedit) window.Azedit.pilihGambar();
          }
        });
        ed.on('init', function () {
          editor = ed;
          ed.setContent(isiAwal || '');
          ed.undoManager.clear();
          ed.setDirty(false);
          kontenAwal = ed.getContent();
          if (petunjuk) ed.getBody().setAttribute('data-petunjuk', petunjuk);
          document.getElementById('status').style.display = 'none';
          if (window.Azedit && window.Azedit.siap) window.Azedit.siap();
        });
        ed.on('change keyup SetContent ExecCommand', function () {
          if (ed.isDirty() && window.Azedit && window.Azedit.berubah) window.Azedit.berubah();
        });
      }
    });
    window.addEventListener('resize', function () {
      if (editor && editor.theme && editor.theme.resizeTo) editor.theme.resizeTo(null, tinggiEditor());
    });
  }

  function aturSkalaWiris() {
    var skala = Math.min(1, window.innerWidth / LEBAR_WIRIS);
    document.documentElement.style.setProperty('--skala-wiris', String(skala));
  }

  var LEBAR_WIRIS = 460;
  aturSkalaWiris();
  window.addEventListener('resize', aturSkalaWiris);

  var GAYA_DALAM_WIRIS = 'html,body{overflow-x:hidden !important;overscroll-behavior-x:none !important}' +
    '#buttonContainer{position:fixed !important;left:12px !important;bottom:10px !important;z-index:20 !important;float:none !important;margin:0 !important}' +
    '#links,#links_rtl{display:none !important}';

  function rapikanDalamWiris(bingkai) {
    try {
      var dok = bingkai.contentDocument;
      if (!dok || !dok.head || dok.getElementById('az-gaya-wiris')) return;
      var gaya = dok.createElement('style');
      gaya.id = 'az-gaya-wiris';
      gaya.textContent = GAYA_DALAM_WIRIS;
      dok.head.appendChild(gaya);
      var kembaliKiri = function () {
        if (dok.documentElement.scrollLeft) dok.documentElement.scrollLeft = 0;
        if (dok.body && dok.body.scrollLeft) dok.body.scrollLeft = 0;
      };
      kembaliKiri();
      bingkai.contentWindow.addEventListener('scroll', kembaliKiri, true);
    } catch (galat) {
    }
  }

  function pantauBingkaiWiris(bingkai) {
    if (bingkai.getAttribute('data-az-pantau')) return;
    bingkai.setAttribute('data-az-pantau', '1');
    bingkai.addEventListener('load', function () { rapikanDalamWiris(bingkai); });
    rapikanDalamWiris(bingkai);
  }

  new MutationObserver(function () {
    var daftar = document.querySelectorAll('.wrs_modal_iframe');
    for (var i = 0; i < daftar.length; i++) pantauBingkaiWiris(daftar[i]);
  }).observe(document.documentElement, { childList: true, subtree: true });

  window.aturIsi = function (html, dasar, teksPetunjuk) {
    isiAwal = html || '';
    petunjuk = teksPetunjuk || '';
    muatSkrip(alamat('assets/bundle/tinymce/tinymce.min.js'), mulai);
  };

  window.sisipGambar = function (url) {
    if (!editor) return;
    editor.focus();
    editor.insertContent('<img src="' + String(url).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;') + '">');
  };

  window.adaPerubahan = function () {
    if (!editor || kontenAwal === null) return false;
    return editor.getContent() !== kontenAwal;
  };

  window.ambilIsi = function () {
    if (!editor) return isiAwal;
    var html = editor.getContent();
    if (html === '<br>' || html === '<p><br></p>' || html === '<p>&nbsp;</p>') html = '';
    return html;
  };
})();
</script>
</body>
</html>
