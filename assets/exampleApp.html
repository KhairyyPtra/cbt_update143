	function setupWebViewJavascriptBridge(callback) {
		var bridge=window.WebViewJavascriptBridge||window.WKWebViewJavascriptBridge
		if (bridge) { return callback(bridge); }
		var callbacks=window.WVJBCallbacks||window.WKWVJBCallbacks
		if (callbacks) { return callbacks.push(callback); }
		window.WVJBCallbacks=window.WKWVJBCallbacks = [callback];
		if(window.WKWebViewJavascriptBridge){
		  window.webkit.messageHandlers.iOS_Native_InjectJavascript.postMessage(null)
		}else{
			var WVJBIframe = document.createElement('iframe');
			WVJBIframe.style.display = 'none';
			WVJBIframe.src = 'https://__bridge_loaded__';
			document.documentElement.appendChild(WVJBIframe);
			setTimeout(function() { document.documentElement.removeChild(WVJBIframe) }, 0)
		}
	}

<script>
	/* Penanda status untuk tampilan (Styles/modern.css) tanpa selektor :has() agar tetap
	   berfungsi di WebView lama. Hanya menambah/menghapus class; tidak mengubah jawaban. */
	(function () {
		var log = document.getElementById('log');
		if (!log) return;
		function toggle(el, name, on) {
			if (on) el.classList.add(name); else el.classList.remove(name);
		}
		function closest(el, cls, tag) {
			for (var n = el.parentNode; n && n !== log; n = n.parentNode) {
				if (n.tagName === tag && n.classList.contains(cls)) return n;
			}
			return null;
		}
		/* Blok terdekat (p/li/div/td) yang hanya memuat satu gambar opsi. */
		function blockOf(img) {
			for (var n = img.parentNode; n && n !== log; n = n.parentNode) {
				if (/^(P|LI|DIV|TD|H\d)$/.test(n.tagName)) {
					return n.querySelectorAll('img[id^="option"]').length === 1 ? n : null;
				}
			}
			return null;
		}
		/* Mode gelap: teks gelap, latar putih, dan garis hitam bawaan isi soal (mis. dari Word)
		   diganti warna palet gelap. Warna lain (mis. merah untuk penekanan) dibiarkan. */
		var dark = document.documentElement.classList.contains('dark');
		function luma(c) {
			var m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/.exec(c || '');
			if (!m || (m[4] !== undefined && +m[4] < 0.1)) return null;
			return (0.2126 * m[1] + 0.7152 * m[2] + 0.0722 * m[3]) / 255;
		}
		function darkFix() {
			if (!dark) return;
			var els = log.querySelectorAll('*:not([data-dk])');
			for (var i = 0; i < els.length; i++) {
				var el = els[i], cs = window.getComputedStyle(el);
				el.setAttribute('data-dk', '1');
				if (el.tagName === 'IMG') continue;
				var t = luma(cs.color);
				if (t !== null && t < 0.3) el.style.setProperty('color', 'var(--text)', 'important');
				var b = luma(cs.backgroundColor);
				if (b !== null && b > 0.75) el.style.setProperty('background-color', 'transparent', 'important');
				if (parseFloat(cs.borderTopWidth) || parseFloat(cs.borderLeftWidth)) {
					var bc = luma(cs.borderTopColor);
					if (bc !== null && bc < 0.3) el.style.setProperty('border-color', 'var(--border-strong)', 'important');
				}
			}
		}
		function sync() {
			darkFix();
			var rows = log.querySelectorAll('tr.opsi-row');
			for (var i = 0; i < rows.length; i++) {
				var img = rows[i].querySelector('img[id^="option"]');
				var cb = rows[i].querySelector('input[type="checkbox"]');
				var on = (img && (img.getAttribute('src') || '').indexOf('pilih') >= 0) || (cb && cb.checked);
				toggle(rows[i], 'terpilih', !!on);
			}
			var imgs = log.querySelectorAll('img[id^="option"]');
			for (var m = 0; m < imgs.length; m++) {
				if (closest(imgs[m], 'opsi-row', 'TR')) continue;
				var box = blockOf(imgs[m]);
				if (!box) continue;
				box.classList.add('opsi-inline');
				toggle(box, 'terpilih', (imgs[m].getAttribute('src') || '').indexOf('pilih') >= 0);
			}
			var kat = log.querySelectorAll('tr.kategori-row');
			for (var k = 0; k < kat.length; k++) {
				toggle(kat[k], 'terisi', !!kat[k].querySelector('input:checked'));
			}
			var jodoh = log.querySelectorAll('tr.jodoh-row');
			for (var j = 0; j < jodoh.length; j++) {
				var btn = jodoh[j].querySelector('.btn');
				toggle(jodoh[j], 'terisi', !!btn && btn.textContent.replace(/\s+/g, ' ').trim() !== 'Pilih Jawaban');
			}
		}
		if (window.MutationObserver) {
			new MutationObserver(sync).observe(log, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['src', 'checked'] });
		}
		document.addEventListener('click', function () { setTimeout(sync, 0); }, true);
		document.addEventListener('change', function () { setTimeout(sync, 0); }, true);
		setInterval(sync, 1000);
	})();
</script>

<script>
	/* Ketuk di mana saja pada area pilihan jawaban (teks maupun kotaknya) = ketuk ikon hurufnya. Berlaku untuk PG biasa,
	   PG kompleks, dan PG tetap (pilihan di dalam tabel/paragraf buatan guru): naik dari elemen yang diketuk sampai
	   menemukan pembungkus yang berisi tepat satu ikon pilihan; bila lebih dulu bertemu pembungkus berisi dua ikon atau
	   lebih (teks soal, baris berisi beberapa pilihan), tidak memilih apa pun. Gambar di dalam teks tetap membuka
	   perbesaran; tautan dan isian tetap berfungsi seperti biasa. */
	document.addEventListener('click', function (e) {
		var t = e.target;
		if (!t || !t.closest) return;
		var wadah = t.closest('#log');
		if (!wadah) return;
		if (t.tagName === 'IMG' || t.closest('a, input, select, textarea, button, label, math-field')) return;
		var el = t;
		while (el && el !== wadah) {
			var ikon = el.querySelectorAll ? el.querySelectorAll('img[id^="option"]') : [];
			if (ikon.length > 1) return;
			if (ikon.length === 1) {
				/* Ikon yang dinonaktifkan (mis. halaman tinjau hasil memberi pointer-events: none) tidak boleh terpilih lewat baris. */
				var gaya = window.getComputedStyle ? window.getComputedStyle(ikon[0]) : null;
				if (gaya && gaya.pointerEvents === 'none') return;
				if (typeof ikon[0].onclick === 'function') ikon[0].click();
				return;
			}
			el = el.parentElement;
		}
	});
</script>
